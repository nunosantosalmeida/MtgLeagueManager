services:
  commanderleaguemanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commanderleaguemanager
    depends_on:
      - postgres
    ports:
      - 8080:8080
    restart: on-failure

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_DB=quarkus_test
      - POSTGRES_USER=quarkus_test
      - POSTGRES_PASSWORD=quarkus_test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  postgres-data: