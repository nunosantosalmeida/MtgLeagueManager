<!DOCTYPE html>

<head>
    <title>{#insert title /}</title>

    <link rel="stylesheet" type="screen" href="main.css">
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid black;
            text-align: center;
        }
        table {
            table-layout: fixed;
            width: 100%;
        }
        th, thead {
            border: 2px solid black;
        }
        td {
            border: 1px solid black;
        }

        .top10 {
            background-color: #d4d4d4;
        }

        ul {
          list-style-type: none;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background-color: #333;
        }

        li {
          float: left;
        }

        li a {
          display: block;
          color: white;
          text-align: center;
          padding: 14px 16px;
          text-decoration: none;
        }

        li a:hover {
          background-color: #111;
        }

        form  { display: table;      }
        p     { display: table-row;  }
        label { display: table-cell; }
        input { display: table-cell; }

    </style>

</head>

}
